<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Second Stitch | Legacy Interface</title>
    <!-- Preconnect to improve connection speed -->
    <link rel="preconnect" href="https://elevenlabs.io">
    <script src="https://elevenlabs.io/convai-widget/index.js" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #050505;
            --accent-color: #7d8cc4;
            --text-main: #ffffff;
            --text-dim: #555555;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        /* Abstract Pulse Animation */
        .pulse-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-core {
            width: 12px;
            height: 12px;
            background-color: var(--accent-color);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 0 20px var(--accent-color);
        }

        .pulse-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid var(--accent-color);
            border-radius: 50%;
            opacity: 0;
            animation: ring-expand 4s cubic-bezier(0.2, 0.4, 0.4, 1) infinite;
        }

        .pulse-ring:nth-child(2) { animation-delay: 1.3s; }
        .pulse-ring:nth-child(3) { animation-delay: 2.6s; }

        @keyframes ring-expand {
            0% { transform: scale(0.1); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        #start-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--text-main);
            padding: 15px 40px;
            font-size: 0.8rem;
            letter-spacing: 0.3rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            z-index: 10;
        }

        #start-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 30px var(--accent-color);
        }

        #start-btn:disabled {
            border-color: #333;
            color: #333;
            cursor: not-allowed;
        }

        #status-text {
            margin-top: 20px;
            font-size: 0.7rem;
            color: var(--text-dim);
            letter-spacing: 0.1rem;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="pulse-container">
        <div class="pulse-core"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
        <div class="pulse-ring"></div>
    </div>

    <button id="start-btn" disabled>Loading SDK...</button>
    <div id="status-text">Checking environment</div>

    <script>
        const agentId = 'agent_1101kqwbfdywf85tybrpvnypx7xk';
        const startBtn = document.getElementById('start-btn');
        const statusText = document.getElementById('status-text');

        // Robust check for SDK readiness
        const initInterval = setInterval(() => {
            if (window.ElevenLabsConvAI) {
                startBtn.disabled = false;
                startBtn.innerText = "Initiate Interview";
                statusText.innerText = "Ready";
                clearInterval(initInterval);
            }
        }, 500);

        startBtn.addEventListener('click', async () => {
            try {
                statusText.innerText = "Requesting Microphone...";
                startBtn.disabled = true;

                await window.ElevenLabsConvAI.startSession({
                    agentId: agentId,
                    onConnect: () => {
                        statusText.innerText = "Conversation Active";
                        startBtn.innerText = "Connected";
                    },
                    onDisconnect: () => {
                        statusText.innerText = "Session Ended";
                        startBtn.disabled = false;
                        startBtn.innerText = "Restart Interview";
                    },
                    onError: (err) => {
                        console.error("Session Error:", err);
                        statusText.innerText = "Error: Check Microphone Permissions";
                        startBtn.disabled = false;
                    }
                });
            } catch (error) {
                console.error("Init Error:", error);
                statusText.innerText = "Connection Failed";
                startBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
