<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Second Stitch</title>
    <!-- 1. Use the correct script source provided by ElevenLabs -->
    <script src="https://elevenlabs.io/convai-widget/index.js" type="text/javascript"></script>
    <style>
        :root { --bg: #050505; --accent: #7d8cc4; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .pulse-container { position: relative; width: 100px; height: 100px; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; }
        .pulse-core { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 15px var(--accent); }
        .ring { position: absolute; width: 100%; height: 100%; border: 1px solid var(--accent); border-radius: 50%; opacity: 0; animation: ring 3s infinite; }
        .ring:nth-child(2) { animation-delay: 1s; }
        @keyframes ring { 0% { transform: scale(0.1); opacity: 0; } 50% { opacity: 0.4; } 100% { transform: scale(1.5); opacity: 0; } }
        button { background: none; border: 1px solid var(--accent); color: white; padding: 12px 30px; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:hover:not(:disabled) { background: var(--accent); color: black; }
        button:disabled { opacity: 0.3; cursor: wait; }
    </style>
</head>
<body>

    <div class="pulse-container">
        <div class="pulse-core"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

    <button id="start-btn" disabled>Loading...</button>

    <script>
        const btn = document.getElementById('start-btn');
        const agentId = 'agent_1101kqwbfdywf85tybrpvnypx7xk';

        // 2. Explicitly wait for the SDK to attach to the window object
        const initCheck = setInterval(() => {
            if (window.ElevenLabsConvAI && typeof window.ElevenLabsConvAI.startSession === 'function') {
                btn.innerText = "Initiate Interview";
                btn.disabled = false;
                clearInterval(initCheck);
            }
        }, 500);

        btn.onclick = async () => {
            try {
                btn.disabled = true;
                btn.innerText = "Connecting...";

                // 3. Trigger session with explicit agentId
                const session = await window.ElevenLabsConvAI.startSession({
                    agentId: agentId,
                    onConnect: () => { btn.innerText = "Connected"; },
                    onDisconnect: () => { btn.innerText = "Initiate Interview"; btn.disabled = false; }
                });
            } catch (err) {
                console.error("Critical Error:", err);
                alert("Check if microphone is allowed and ad-blockers are off.");
                btn.disabled = false;
                btn.innerText = "Retry";
            }
        };
    </script>
</body>
</html>
