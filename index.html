<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Second Stitch</title>
    <style>
        :root { --bg: #050505; --accent: #7d8cc4; }
        body { background: var(--bg); color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .pulse-container { position: relative; width: 100px; height: 100px; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; }
        .pulse-core { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; box-shadow: 0 0 15px var(--accent); }
        .ring { position: absolute; width: 100%; height: 100%; border: 1px solid var(--accent); border-radius: 50%; opacity: 0; animation: ring 3s infinite; }
        @keyframes ring { 0% { transform: scale(0.1); opacity: 0; } 50% { opacity: 0.4; } 100% { transform: scale(1.5); opacity: 0; } }
        button { background: none; border: 1px solid var(--accent); color: white; padding: 12px 30px; letter-spacing: 2px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="pulse-container">
        <div class="pulse-core"></div>
        <div class="ring" style="animation-delay: 0s"></div>
        <div class="ring" style="animation-delay: 1.5s"></div>
    </div>

    <button id="start-btn">Start Interview</button>

    <script>
        const btn = document.getElementById('start-btn');

        const loadSDK = () => {
            return new Promise((resolve, reject) => {
                if (window.ElevenLabsConvAI) return resolve();
                const script = document.createElement('script');
                script.src = "https://elevenlabs.io/convai-widget/index.js";
                script.onload = () => resolve();
                script.onerror = () => reject("The ElevenLabs SDK was blocked by your browser or network.");
                document.head.appendChild(script);
            });
        };

        btn.onclick = async () => {
            btn.disabled = true;
            btn.innerText = "Loading SDK...";
            
            try {
                await loadSDK();
                btn.innerText = "Connecting Agent...";

                await window.ElevenLabsConvAI.startSession({
                    agentId: 'agent_1101kqwbfdywf85tybrpvnypx7xk',
                    onConnect: () => { btn.innerText = "Active Session"; },
                    onDisconnect: () => { 
                        btn.innerText = "Start Interview"; 
                        btn.disabled = false; 
                    }
                });
            } catch (err) {
                console.error(err);
                alert(err); // This will tell us if it's a network block
                btn.innerText = "Load Failed";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
